<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-label="Teach a CNN to recognize digits"><rect width="960" height="190" fill="#f8fafc"/><text x="30" y="32" font-family="Arial" font-size="20" font-weight="bold" fill="#0f172a">Teach a CNN to recognize digits</text><rect x="30" y="65" width="185" height="70" rx="13" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="122" y="91" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e1b4b">8×8 images</text><text x="122" y="114" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">1,797 examples</text><rect x="245" y="65" width="185" height="70" rx="13" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="337" y="91" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e1b4b">Convolution</text><text x="337" y="114" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Learn strokes</text><path d="M221 100 h19" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M235 94 l8 6 -8 6" stroke="#2563eb" fill="none" stroke-width="3"/><rect x="460" y="65" width="185" height="70" rx="13" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="552" y="91" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e1b4b">Pooling + dense</text><text x="552" y="114" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Build features</text><path d="M436 100 h19" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M450 94 l8 6 -8 6" stroke="#2563eb" fill="none" stroke-width="3"/><rect x="675" y="65" width="185" height="70" rx="13" fill="#eef2ff" stroke="#4338ca" stroke-width="2"/><text x="767" y="91" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#1e1b4b">10 probabilities</text><text x="767" y="114" text-anchor="middle" font-family="Arial" font-size="12" fill="#334155">Pick a digit</text><path d="M651 100 h19" stroke="#2563eb" stroke-width="3" fill="none"/><path d="M665 94 l8 6 -8 6" stroke="#2563eb" fill="none" stroke-width="3"/></svg>