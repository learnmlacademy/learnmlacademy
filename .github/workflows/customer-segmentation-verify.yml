name: Customer Segmentation Verify

permissions:
  contents: write

on:
  push:
    branches:
      - parallel/customer-segmentation-handbook
    paths:
      - "projects/customer-segmentation/**"
      - "src/pages/CustomerSegmentationProjectPage.tsx"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "public/project-handbooks/customer-segmentation/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/customer-segmentation-verify.yml"
  pull_request:
    paths:
      - "projects/customer-segmentation/**"
      - "src/pages/CustomerSegmentationProjectPage.tsx"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "public/project-handbooks/customer-segmentation/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/customer-segmentation-verify.yml"

concurrency:
  group: customer-segmentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/customer-segmentation/requirements.txt

      - name: Install project dependencies
        working-directory: projects/customer-segmentation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Download and validate UCI Online Retail
        working-directory: projects/customer-segmentation
        run: python download_data.py

      - name: Build RFM segments and evidence
        working-directory: projects/customer-segmentation
        env:
          MPLBACKEND: Agg
        run: python src/build_segments.py

      - name: Run segmentation tests
        working-directory: projects/customer-segmentation
        run: pytest -q

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-segmentation-engineering
          path: |
            projects/customer-segmentation/models/
            projects/customer-segmentation/outputs/
          if-no-files-found: warn
          retention-days: 14
