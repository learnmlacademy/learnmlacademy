name: Customer Segmentation Verify

permissions:
  contents: write

on:
  push:
    branches:
      - feat/customer-segmentation-handbook
      - fix/segmentation-data-grounded-names-20261009
    paths:
      - "projects/customer-segmentation/**"
      - "src/pages/CustomerSegmentationProjectPage.tsx"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "public/project-handbooks/customer-segmentation/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/customer-segmentation-verify.yml"
  pull_request:
    paths:
      - "projects/customer-segmentation/**"
      - "src/pages/CustomerSegmentationProjectPage.tsx"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "public/project-handbooks/customer-segmentation/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/customer-segmentation-verify.yml"

concurrency:
  group: customer-segmentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/customer-segmentation/requirements.txt

      - name: Install project dependencies
        working-directory: projects/customer-segmentation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Download and validate UCI Online Retail
        working-directory: projects/customer-segmentation
        run: python download_data.py

      - name: Build customer segments
        working-directory: projects/customer-segmentation
        env:
          MPLBACKEND: Agg
        run: python src/build_segments.py

      - name: Run customer-segmentation tests
        working-directory: projects/customer-segmentation
        run: pytest -q

      - name: Install Chromium for real screenshots
        working-directory: projects/customer-segmentation
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Start Streamlit
        working-directory: projects/customer-segmentation
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/customer-segmentation.log 2>&1 &
          echo $! >/tmp/customer-segmentation.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/customer-segmentation.log
          exit 1

      - name: Capture genuine app screenshots
        working-directory: projects/customer-segmentation
        run: python scripts/capture_app_screenshots.py

      - name: Store verified visual evidence in working tree
        run: |
          mkdir -p public/project-handbooks/customer-segmentation
          cp projects/customer-segmentation/outputs/rfm_distributions.png public/project-handbooks/customer-segmentation/
          cp projects/customer-segmentation/outputs/k_selection.png public/project-handbooks/customer-segmentation/
          cp projects/customer-segmentation/outputs/pca_segments.png public/project-handbooks/customer-segmentation/
          cp projects/customer-segmentation/outputs/cluster_profiles.png public/project-handbooks/customer-segmentation/
          cp projects/customer-segmentation/outputs/method_comparison.png public/project-handbooks/customer-segmentation/
          cp projects/customer-segmentation/outputs/screenshots/*.png public/project-handbooks/customer-segmentation/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Build and prerender website
        run: npm run build

      - name: Start built website preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/customer-segmentation-site.log 2>&1 &
          echo $! >/tmp/customer-segmentation-site.pid

      - name: Verify handbook on desktop and mobile
        working-directory: projects/customer-segmentation
        run: python scripts/verify_handbook_page.py

      - name: Commit verified visual evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/segmentation-data-grounded-names-20261009' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-handbooks/customer-segmentation/
          if git diff --cached --quiet; then
            echo "Verified screenshots are already current."
          else
            git commit -m "Project 4: store verified visual evidence [skip ci]"
            git restore .
            git pull --rebase origin fix/segmentation-data-grounded-names-20261009
            git push origin HEAD:fix/segmentation-data-grounded-names-20261009
          fi

      - name: Stop preview processes
        if: always()
        run: |
          if [ -f /tmp/customer-segmentation.pid ]; then kill $(cat /tmp/customer-segmentation.pid) || true; fi
          if [ -f /tmp/customer-segmentation-site.pid ]; then kill $(cat /tmp/customer-segmentation-site.pid) || true; fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: customer-segmentation-evidence
          path: |
            projects/customer-segmentation/models/
            projects/customer-segmentation/outputs/
          if-no-files-found: warn
          retention-days: 14
