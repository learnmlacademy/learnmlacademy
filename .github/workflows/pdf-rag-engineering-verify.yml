name: PDF RAG engineering
on:
  push:
    branches: [feat/pdf-rag-engineering]
    paths:
      - 'projects/pdf-rag-assistant/**'
      - '.github/workflows/pdf-rag-engineering-verify.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: pdf-rag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engineering:
    if: github.ref == 'refs/heads/feat/pdf-rag-engineering'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: projects/pdf-rag-assistant
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_IMPLICIT_TOKEN: '1'
      RAG_LLM_API_KEY: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.16'
          cache: pip
          cache-dependency-path: projects/pdf-rag-assistant/requirements.txt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: projects/pdf-rag-assistant/.cache/huggingface
          key: minilm-onnx-${{ runner.os }}-1110a243fdf4706b3f48f1d95db1a4f5529b4d41
      - name: Install exact environment
        run: |
          mkdir -p reports
          python -m pip install --no-compile -r requirements.txt
          python -m pip check
          python -m pip freeze > reports/dependencies.txt
      - name: Generate original synthetic PDFs and build real local index
        run: |
          python -m scripts.create_test_pdfs
          python -m scripts.build_index --pdf-dir data/pdfs --name demo
      - name: Known queries, unsupported question and evidence tables
        run: |
          python -m scripts.engineering_evidence
          python -m scripts.query --name demo --question "What is the refund window?" > reports/cli-query.json
      - name: All extraction, embedding, retrieval, citation and app tests
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - name: Install real browser
        run: python -m playwright install --with-deps chromium
      - name: Start Streamlit and verify its health
        run: |
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 --browser.gatherUsageStats false > reports/streamlit.log 2>&1 &
          echo $! > reports/streamlit.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then exit 0; fi
            sleep 2
          done
          echo 'Streamlit health check failed'
          exit 1
      - name: Real upload, answer, citations, isolation and screenshots
        run: python -m scripts.capture_app
      - name: Stop only this job's Streamlit
        if: always()
        run: |
          if [ -f reports/streamlit.pid ]; then kill "$(cat reports/streamlit.pid)" 2>/dev/null || true; fi
      - name: Upload synthetic engineering evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pdf-rag-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            projects/pdf-rag-assistant/reports/*.json
            projects/pdf-rag-assistant/reports/*.md
            projects/pdf-rag-assistant/reports/*.xml
            projects/pdf-rag-assistant/reports/*.png
            projects/pdf-rag-assistant/reports/*.log
            projects/pdf-rag-assistant/reports/dependencies.txt
          if-no-files-found: warn
          retention-days: 14

  repository-checks:
    if: github.ref == 'refs/heads/feat/pdf-rag-engineering'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vite build --configLoader runner
