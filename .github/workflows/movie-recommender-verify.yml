name: Movie Recommender Verify

permissions:
  contents: write

on:
  push:
    branches:
      - parallel/movie-recommender-handbook
    paths:
      - "projects/movie-recommender/**"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "src/pages/MovieRecommenderProjectPage.tsx"
      - "public/project-handbooks/movie-recommender/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/movie-recommender-verify.yml"
  pull_request:
    paths:
      - "projects/movie-recommender/**"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "src/pages/MovieRecommenderProjectPage.tsx"
      - "public/project-handbooks/movie-recommender/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/movie-recommender-verify.yml"

concurrency:
  group: movie-recommender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/movie-recommender/requirements.txt

      - name: Install project dependencies
        working-directory: projects/movie-recommender
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "playwright>=1.50,<2"
          python -m pip check

      - name: Download official MovieLens 100K
        working-directory: projects/movie-recommender
        run: python download_data.py

      - name: Build recommender artifacts
        working-directory: projects/movie-recommender
        env:
          MPLBACKEND: Agg
        run: python src/build_recommender.py

      - name: Run recommendation tests
        working-directory: projects/movie-recommender
        run: pytest -q

      - name: Install Chromium
        working-directory: projects/movie-recommender
        run: python -m playwright install --with-deps chromium

      - name: Start Streamlit
        working-directory: projects/movie-recommender
        run: |
          nohup python -m streamlit run app.py             --server.headless true             --server.address 127.0.0.1             --server.port 8501             >/tmp/movie-recommender-streamlit.log 2>&1 &
          echo $! >/tmp/movie-recommender-streamlit.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/movie-recommender-streamlit.log
          exit 1

      - name: Capture genuine Streamlit screenshots
        working-directory: projects/movie-recommender
        run: python scripts/capture_app_screenshots.py

      - name: Store verified visual evidence in working tree
        if: github.event_name == 'push' && success()
        working-directory: projects/movie-recommender
        run: |
          mkdir -p ../../public/project-handbooks/movie-recommender
          cp outputs/rating_distribution.png ../../public/project-handbooks/movie-recommender/
          cp outputs/screenshots/movie-recommender-form.png ../../public/project-handbooks/movie-recommender/
          cp outputs/screenshots/movie-recommender-results.png ../../public/project-handbooks/movie-recommender/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Build and prerender website
        run: npm run build

      - name: Start built website preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/movie-recommender-site-preview.log 2>&1 &
          echo $! >/tmp/movie-recommender-site-preview.pid

      - name: Verify handbook on desktop and mobile
        working-directory: projects/movie-recommender
        run: python scripts/verify_handbook_page.py

      - name: Commit verified visual evidence to review branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/parallel/movie-recommender-handbook' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-handbooks/movie-recommender/
          if git diff --cached --quiet; then
            echo "Verified screenshots are already current."
          else
            git commit -m "Movie recommender: store verified screenshots [skip ci]"
            git restore .
            git pull --rebase origin parallel/movie-recommender-handbook
            git push origin HEAD:parallel/movie-recommender-handbook
          fi

      - name: Stop preview processes
        if: always()
        run: |
          if [ -f /tmp/movie-recommender-streamlit.pid ]; then
            kill $(cat /tmp/movie-recommender-streamlit.pid) || true
          fi
          if [ -f /tmp/movie-recommender-site-preview.pid ]; then
            kill $(cat /tmp/movie-recommender-site-preview.pid) || true
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: movie-recommender-evidence
          path: |
            projects/movie-recommender/models/
            projects/movie-recommender/outputs/
          if-no-files-found: warn
          retention-days: 14
