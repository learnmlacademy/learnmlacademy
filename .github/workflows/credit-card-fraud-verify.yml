name: Credit Card Fraud Verify

permissions:
  contents: write

on:
  push:
    branches:
      - parallel/credit-card-fraud-handbook
    paths:
      - "projects/credit-card-fraud/**"
      - "src/pages/CreditCardFraudProjectPage.tsx"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "public/project-handbooks/credit-card-fraud/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/credit-card-fraud-verify.yml"
  pull_request:
    paths:
      - "projects/credit-card-fraud/**"
      - "src/pages/CreditCardFraudProjectPage.tsx"
      - "src/App.tsx"
      - "src/data/projectPortfolio.ts"
      - "public/project-handbooks/credit-card-fraud/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/credit-card-fraud-verify.yml"

concurrency:
  group: credit-card-fraud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/credit-card-fraud/requirements.txt

      - name: Install project dependencies
        working-directory: projects/credit-card-fraud
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Download and validate OpenML fraud data
        working-directory: projects/credit-card-fraud
        run: python download_data.py

      - name: Train, compare, tune threshold and evaluate
        working-directory: projects/credit-card-fraud
        env:
          MPLBACKEND: Agg
        run: python src/train_model.py

      - name: Run fraud project tests
        working-directory: projects/credit-card-fraud
        run: pytest -q

      - name: Install Chromium for real screenshots
        working-directory: projects/credit-card-fraud
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Start Streamlit
        working-directory: projects/credit-card-fraud
        run: |
          nohup python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8501 >/tmp/fraud-streamlit.log 2>&1 &
          echo $! >/tmp/fraud-streamlit.pid
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fraud-streamlit.log
          exit 1

      - name: Capture genuine Streamlit screenshots
        working-directory: projects/credit-card-fraud
        run: python scripts/capture_app_screenshots.py

      - name: Store verified visual evidence in working tree
        if: github.event_name == 'push' && success()
        run: |
          mkdir -p public/project-handbooks/credit-card-fraud
          cp projects/credit-card-fraud/outputs/class_imbalance.png public/project-handbooks/credit-card-fraud/
          cp projects/credit-card-fraud/outputs/model_comparison.png public/project-handbooks/credit-card-fraud/
          cp projects/credit-card-fraud/outputs/threshold_tradeoff.png public/project-handbooks/credit-card-fraud/
          cp projects/credit-card-fraud/outputs/confusion_matrix.png public/project-handbooks/credit-card-fraud/
          cp projects/credit-card-fraud/outputs/precision_recall_curve.png public/project-handbooks/credit-card-fraud/
          cp projects/credit-card-fraud/outputs/screenshots/*.png public/project-handbooks/credit-card-fraud/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install website dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Build and prerender website
        run: npm run build

      - name: Start built website preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/fraud-site.log 2>&1 &
          echo $! >/tmp/fraud-site.pid

      - name: Verify handbook on desktop and mobile
        working-directory: projects/credit-card-fraud
        run: python scripts/verify_handbook_page.py

      - name: Commit verified visual evidence
        if: github.event_name == 'push' && github.ref == 'refs/heads/parallel/credit-card-fraud-handbook' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-handbooks/credit-card-fraud/
          if git diff --cached --quiet; then
            echo "Verified screenshots are already current."
          else
            git commit -m "Project 3: store verified screenshots [skip ci]"
            git restore .
            git pull --rebase origin parallel/credit-card-fraud-handbook
            git push origin HEAD:parallel/credit-card-fraud-handbook
          fi

      - name: Stop preview processes
        if: always()
        run: |
          if [ -f /tmp/fraud-streamlit.pid ]; then kill $(cat /tmp/fraud-streamlit.pid) || true; fi
          if [ -f /tmp/fraud-site.pid ]; then kill $(cat /tmp/fraud-site.pid) || true; fi

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credit-card-fraud-engineering
          path: |
            projects/credit-card-fraud/models/
            projects/credit-card-fraud/outputs/
          if-no-files-found: warn
          retention-days: 14
