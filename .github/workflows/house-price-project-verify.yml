name: Verify House Price Project

concurrency:
  group: house-price-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

on:
  push:
    branches:
      - parallel/house-price-handbook
      - enhance/project-screenshot-coverage
    paths:
      - "projects/house-price-predictor/**"
      - "src/**"
      - "public/project-handbooks/house-price/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/house-price-project-verify.yml"
  pull_request:
    paths:
      - "projects/house-price-predictor/**"
      - "src/**"
      - "public/project-handbooks/house-price/**"
      - "scripts/prerender.mjs"
      - "generate_sitemap.cjs"
      - ".github/workflows/house-price-project-verify.yml"

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/house-price-predictor

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: projects/house-price-predictor/requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download official Ames Housing data
        run: python download_data.py

      - name: Train, compare, tune and save model
        run: python src/train_model.py

      - name: Run Streamlit app test
        run: pytest -q

      - name: Start Streamlit and verify HTTP response
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > outputs/streamlit.log 2>&1 &
          echo $! > /tmp/house_price_streamlit.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              echo
              echo "Streamlit health check passed."
              kill $(cat /tmp/house_price_streamlit.pid) || true
              break
            fi
            sleep 2
          done
          if ! grep -q "You can now view your Streamlit app" outputs/streamlit.log; then
            cat outputs/streamlit.log
          fi

      - name: Install browser for real screenshots
        run: |
          pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium

      - name: Capture real Streamlit screenshots
        run: python scripts/capture_app_screenshot.py

      - name: Capture real Visual Studio Code screenshots
        if: github.event_name == 'push'
        run: bash scripts/capture_vscode_screenshots.sh

      - name: Store verified visual evidence in working tree
        if: github.event_name == 'push' && success()
        run: |
          mkdir -p ../../public/project-handbooks/house-price
          cp outputs/streamlit-house-price-app.png ../../public/project-handbooks/house-price/
          cp outputs/streamlit-house-price-prediction.png ../../public/project-handbooks/house-price/
          cp outputs/streamlit-house-price-model-details.png ../../public/project-handbooks/house-price/
          cp outputs/streamlit-house-price-validation-warning.png ../../public/project-handbooks/house-price/
          cp outputs/actual_vs_predicted.png ../../public/project-handbooks/house-price/
          cp outputs/living_area_vs_sale_price.png ../../public/project-handbooks/house-price/
          cp outputs/vscode-*.png ../../public/project-handbooks/house-price/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install website dependencies
        run: |
          cd ../..
          npm ci

      - name: TypeScript validation
        run: |
          cd ../..
          npm run lint

      - name: Build and prerender website
        run: |
          cd ../..
          npm run build

      - name: Start built website preview
        run: |
          cd ../..
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/house-price-site-preview.log 2>&1 &
          echo $! > /tmp/house-price-site-preview.pid

      - name: Verify handbook on desktop and mobile
        run: python scripts/verify_handbook_page.py

      - name: Commit verified visual evidence to review branch
        if: github.event_name == 'push' && (github.ref == 'refs/heads/parallel/house-price-handbook' || github.ref == 'refs/heads/enhance/project-screenshot-coverage')
        run: |
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-handbooks/house-price/
          if git diff --cached --quiet; then
            echo "Verified screenshots are already current."
          else
            git commit -m "House price project: store verified screenshots [skip ci]"
            # Training/build steps may rewrite tracked generated files. Keep only the
            # evidence commit before rebasing onto any concurrent branch update.
            git restore .
            BRANCH="${GITHUB_REF#refs/heads/}"
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Stop built website preview
        if: always()
        run: |
          if [ -f /tmp/house-price-site-preview.pid ]; then
            kill $(cat /tmp/house-price-site-preview.pid) || true
          fi

      - name: Upload real training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: house-price-project-evidence
          path: |
            projects/house-price-predictor/models/
            projects/house-price-predictor/outputs/
          if-no-files-found: warn
          retention-days: 14
