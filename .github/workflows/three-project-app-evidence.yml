name: Three Projects — Genuine App Screenshot Evidence

on:
  push:
    branches:
      - feat/complete-three-projects-20261009
    paths:
      - 'projects/digit-recognizer/**'
      - 'projects/retail-forecasting/**'
      - 'projects/disaster-tweets/**'
      - 'scripts/capture_three_projects.py'
      - '.github/workflows/three-project-app-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: three-projects-real-evidence
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            projects/digit-recognizer/requirements.txt
            projects/retail-forecasting/requirements.txt
            projects/disaster-tweets/requirements.txt
      - name: Install each project plus real browser tools
        run: |
          python -m pip install -r projects/digit-recognizer/requirements.txt
          python -m pip install -r projects/retail-forecasting/requirements.txt
          python -m pip install -r projects/disaster-tweets/requirements.txt
          python -m pip install "playwright>=1.49,<2"
          python -m playwright install --with-deps chromium
      - name: Train real CNN on bundled authentic digits
        run: python train.py
        working-directory: projects/digit-recognizer
      - name: Download authentic UCI retail data and verify SHA-256
        run: python download_data.py
        working-directory: projects/retail-forecasting
      - name: Train and evaluate the actual UCI retail dataset
        run: python train.py
        working-directory: projects/retail-forecasting
      - name: Train transparent fictional-fixture NLP demo (Kaggle license not bypassed)
        working-directory: projects/disaster-tweets
        run: |
          python -c "import runpy; from pathlib import Path; from src.detect import train_and_evaluate; frame=runpy.run_path('tests/test_detect.py')['examples'](); result=train_and_evaluate(frame, Path('artifacts')); print(result['dataset']); print(result['test'])"
      - name: Capture authentic desktop and mobile browser screenshots
        run: python scripts/capture_three_projects.py
      - uses: actions/upload-artifact@v4
        with:
          name: three-project-real-app-evidence
          path: |
            public/project-handbooks/digit-recognizer/*-app.png
            public/project-handbooks/retail-forecasting/*-app.png
            public/project-handbooks/disaster-tweets/*-app.png
      - name: Commit real browser screenshots to the feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/project-handbooks/digit-recognizer/*-app.png
          git add public/project-handbooks/retail-forecasting/*-app.png
          git add public/project-handbooks/disaster-tweets/*-app.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add genuine three-project app screenshots [skip ci]"
            git fetch origin feat/complete-three-projects-20261009
            git rebase origin/feat/complete-three-projects-20261009
            git push origin "HEAD:feat/complete-three-projects-20261009"
          fi
