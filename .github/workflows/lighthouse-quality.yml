name: Lighthouse performance and accessibility audit

on:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/lighthouse-quality.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "vite.config.ts"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/lighthouse-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Run real Chrome Lighthouse checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lighthouse-reports
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > lighthouse-reports/preview.log 2>&1 &
          echo $! > lighthouse-reports/preview.pid
          trap 'kill "$(cat lighthouse-reports/preview.pid)" || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          for route in home projects lesson; do
            case "$route" in
              home) path="/" ;;
              projects) path="/projects" ;;
              lesson) path="/learn/train-test-split" ;;
            esac
            npx --yes lighthouse@12.8.2 "http://127.0.0.1:4173${path}" \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
              --only-categories=performance,accessibility,best-practices,seo \
              --quiet --output=json --output-path="lighthouse-reports/${route}-mobile.json"
          done
          node scripts/report-lighthouse.mjs
      - name: Save real Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-project-audit
          path: lighthouse-reports/
          if-no-files-found: ignore
          retention-days: 14
